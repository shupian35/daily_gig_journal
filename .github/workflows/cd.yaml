name: CD

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.gitignore'

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: 解析分支与版本
    runs-on: ubuntu-latest
    outputs:
      branch_type: ${{ steps.classify.outputs.branch_type }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判断分支类型
        id: classify
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "branch_type=main" >> "$GITHUB_OUTPUT"
          else
            echo "branch_type=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: 读取 pubspec 版本
        id: version
        run: |
          FULL=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION=$(echo "$FULL" | cut -d'+' -f1)
          BUILD=$(echo "$FULL" | cut -d'+' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"

      - name: 读取 git 短 hash
        id: sha
        run: |
          SHORT_SHA=$(git rev-parse --short "${{ github.sha }}")
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: 判断是否触发发版
        id: check
        run: |
          if [ "${{ steps.classify.outputs.branch_type }}" = "main" ]; then
            CURRENT_TAG="v${{ steps.version.outputs.version }}"
            if git tag -l "$CURRENT_TAG" | grep -q "$CURRENT_TAG"; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Tag v${{ steps.version.outputs.version }} 已存在，跳过正式发版"
            else
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "Tag v${{ steps.version.outputs.version }} 不存在，将创建正式发版"
            fi
          else
            # dev 分支每次推送都生成 preview
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    name: 构建 Android APK
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      - name: 构建 Android APK
        run: flutter build apk --release

      - name: 重命名 APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/日程清单.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/日程清单.apk
          retention-days: 30

  build-ios:
    name: 构建 iOS IPA
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      - name: 构建 iOS（无签名）
        run: flutter build ios --release --no-codesign

      - name: 打包 IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r 日程清单.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/日程清单.ipa
        retention-days: 30

  release-main:
    name: 正式发版 (main)
    needs: [plan, build-android, build-ios]
    if: needs.plan.outputs.branch_type == 'main' && needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 创建正式 Tag
        run: |
          git tag "v${{ needs.plan.outputs.version }}"
          git push origin "v${{ needs.plan.outputs.version }}"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布正式版
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: v${{ needs.plan.outputs.version }}
          make_latest: 'true'
          prerelease: 'false'
          files: |
            artifacts/android-apk/日程清单.apk
            artifacts/ios-ipa/日程清单.ipa

  release-preview:
    name: 预发布 (dev)
    needs: [plan, build-android, build-ios]
    if: needs.plan.outputs.branch_type == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 创建 preview Tag
        run: |
          FULL="v${{ needs.plan.outputs.version }}+${{ needs.plan.outputs.build_number }}-${{ needs.plan.outputs.short_sha }}"
          git tag "preview/$FULL"
          git push origin "preview/$FULL"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布预发布版
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview/v${{ needs.plan.outputs.version }}+${{ needs.plan.outputs.build_number }}-${{ needs.plan.outputs.short_sha }}
          name: preview/v${{ needs.plan.outputs.version }}+${{ needs.plan.outputs.build_number }}-${{ needs.plan.outputs.short_sha }}
          make_latest: 'false'
          prerelease: 'true'
          files: |
            artifacts/android-apk/日程清单.apk
            artifacts/ios-ipa/日程清单.ipa